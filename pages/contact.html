  <main id="main">

        </div>
        <div class="ph-line"></div>
      </div>
      <!-- Contenu -->

      <div class="contact-layout">
        <div class="contact-info-card">
          <h2 style="margin-bottom:20px;" data-key="cont-info-t">Coordonnées</h2>
          <div class="contact-row"><div class="contact-icon-wrap">📧</div><div><div class="contact-label" data-key="cont-edu">Email étudiant</div><div class="contact-value"><a href="mailto:Florian.GUETAT@etu.uca.fr">Florian.GUETAT@etu.uca.fr</a></div></div></div>
          <div class="contact-row"><div class="contact-icon-wrap">💼</div><div><div class="contact-label" data-key="cont-pro">Email professionnel</div><div class="contact-value"><a href="mailto:florian.guetat@ntn-snr.fr">florian.guetat@ntn-snr.fr</a></div></div></div>
          <div class="contact-row"><div class="contact-icon-wrap">📍</div><div><div class="contact-label">Clermont-Ferrand</div><div class="contact-value" data-key="cont-cfd">Rue des Meuniers, 63000 Clermont-Ferrand</div></div></div>
          <div class="contact-row"><div class="contact-icon-wrap">📍</div><div><div class="contact-label">Annecy</div><div class="contact-value" data-key="cont-ann">Route des Burnets, 74370 Pringy, Annecy</div></div></div>
        </div>
        <div class="contact-form-card">
          <h2 style="margin-bottom:20px;" data-key="cont-form-t">M'écrire un message</h2>
          <form id="contact-form" novalidate>
          <label class="form-label" for="f-name" data-key="form-name">Votre nom</label>
          <input class="form-input" type="text" id="f-name" name="name" autocomplete="name" required placeholder="Jean Dupont">
          <label class="form-label" for="f-email" data-key="form-email">Votre email</label>
          <input class="form-input" type="email" id="f-email" name="email" autocomplete="email" required placeholder="jean@exemple.fr">
          <label class="form-label" for="f-msg" data-key="form-msg">Message</label>
          <textarea class="form-textarea" id="f-msg" name="message" required placeholder="Bonjour Florian..."></textarea>
          <button class="form-submit" type="submit" data-key="form-send">Envoyer →</button>
          <div id="form-msg" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>
