<!DOCTYPE html>
<!--
  index.html
  Page d'entrée du portfolio — redirige vers pages/accueil.html.
  Toute la personnalisation (langue + thème) se fait via le menu
  Options accessible depuis la sidebar de chaque page.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=pages/accueil.html">
  <title>Florian GUETAT — Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/photo.jpg">
  <style>
    /* Fallback visuel si le refresh ne fonctionne pas */
    body {
      margin: 0;
      min-height: 100vh;
      background: #07080f;
      color: #eeeeff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    a {
      color: #6c63ff;
      text-decoration: none;
      padding: 12px 28px;
      border: 1px solid rgba(108,99,255,0.4);
      border-radius: 9px;
    }
    a:hover { background: rgba(108,99,255,0.12); }
  </style>
</head>
<body>
  <a href="pages/accueil.html">Entrer dans le portfolio →</a>

  <script>
    // Redirection immédiate via JS au cas où le meta refresh échoue
    window.location.replace('pages/accueil.html');
  </script>
</body>
</html>
